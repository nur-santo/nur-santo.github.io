<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio - Iwan Nursanto</title>

<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: #e8eef6;
    color: #2c2c2c;
    font-family: sans-serif;
    font-size: 15px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* =========================
     ANIMATION
  ========================= */

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes zoomFade {
    from {
      opacity: 0;
      transform: scale(.96);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  header,
  section {
    animation: fadeUp .8s ease;
  }

  .card {
    animation: zoomFade .6s ease;
  }

  /* =========================
     HEADER
  ========================= */

  header {
    padding: 72px 40px 56px;
    max-width: 1200px;
    margin: 0 auto;
  }

  header h1 {
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.02em;
    color: #1a1a1a;
  }

  header p {
    color: #6b7280;
    font-size: 15px;
    max-width: 560px;
  }

  section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px 72px;
  }

  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #9ca3af;
    margin-bottom: 20px;
  }

  .card {
    background: #fff;
    border: 1px solid #d1dae6;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .3s ease, box-shadow .3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,.08);
  }

  .card-header {
    padding: 28px 36px;
    border-bottom: 1px solid #e8eef6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .card-header h2 {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 4px;
    color: #1a1a1a;
  }

  .card-header .subtitle {
    font-size: 13px;
    color: #9ca3af;
  }

  .btn {
    display: inline-block;
    padding: 8px 20px;
    background: #2563eb;
    border: 1px solid #2563eb;
    border-radius: 6px;
    font-size: 13px;
    color: #fff;
    white-space: nowrap;
    font-weight: 500;
    transition: .25s ease;
  }

  .btn:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
    transform: translateY(-2px);
  }

  .card-body {
    padding: 36px;
  }

  .feature {
    margin-bottom: 40px;
  }

  .feature:last-child {
    margin-bottom: 0;
  }

  .feature h3 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #6b7280;
    margin-bottom: 6px;
  }

  .feature p {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 16px;
  }

  .gallery {
    display: grid;
    gap: 12px;
  }

  .gallery.cols-2 {
    grid-template-columns: repeat(2, 1fr);
  }

  .gallery.cols-4 {
    grid-template-columns: repeat(4, 1fr);
  }

  .gallery.cols-1 {
    grid-template-columns: 1fr;
    max-width: 480px;
  }

  /* =========================
     IMAGE
  ========================= */

  .gallery img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    border: 1px solid #d1dae6;
    cursor: pointer;
    transition: .35s ease;
  }

  .gallery img:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 24px rgba(0,0,0,.12);
  }

  hr {
    border: none;
    border-top: 1px solid #e8eef6;
    margin: 32px 0;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .tag {
    font-size: 12px;
    padding: 4px 12px;
    border: 1px solid #bfcfe0;
    border-radius: 100px;
    color: #6b7280;
    background: #f0f4fa;
    transition: .25s ease;
  }

  .tag:hover {
    background: #2563eb;
    color: white;
    transform: translateY(-2px);
  }

  ol.flow {
    padding-left: 20px;
    color: #6b7280;
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .adv-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .adv-list li {
    font-size: 14px;
    color: #6b7280;
    padding-left: 16px;
    position: relative;
  }

  .adv-list li::before {
    content: '-';
    position: absolute;
    left: 0;
    color: #9ca3af;
  }

  footer {
    padding: 32px 40px;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    border-top: 1px solid #d1dae6;
  }

  /* =========================
     LIGHTBOX
  ========================= */

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    z-index: 9999;
    opacity: 0;
    visibility: hidden;
    transition: .3s ease;
  }

  .lightbox.show {
    opacity: 1;
    visibility: visible;
  }

  .lightbox img {
    max-width: 95%;
    max-height: 95vh;
    border-radius: 10px;
    animation: zoomFade .3s ease;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }

  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 40px;
    color: white;
    cursor: pointer;
    line-height: 1;
  }

  /* =========================
     RESPONSIVE
  ========================= */

  @media (max-width: 900px) {
    .wrap,
    header,
    section {
      padding-left: 24px;
      padding-right: 24px;
    }

    footer {
      padding-left: 24px;
      padding-right: 24px;
    }

    .gallery.cols-4 {
      grid-template-columns: repeat(2, 1fr);
    }

    .card-body {
      padding: 24px;
    }

    .card-header {
      padding: 20px 24px;
    }
  }

  @media (max-width: 560px) {
    header h1 {
      font-size: 26px;
    }

    .gallery.cols-2 {
      grid-template-columns: 1fr;
    }

    .gallery.cols-4 {
      grid-template-columns: repeat(2, 1fr);
    }

    .gallery.cols-1 {
      max-width: 100%;
    }
  }
</style>
</head>

<body>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="closeLightbox">&times;</span>
  <img id="lightboxImg" src="" alt="">
</div>

<header>
  <h1>Portfolio Project</h1>
  <p>Dua aplikasi terintegrasi untuk manajemen kehadiran karyawan berbasis web dan mobile.</p>
</header>

<!-- isi portfolio kamu tetap -->

<footer>nur-santo / 2025</footer>

<script>
  // LIGHTBOX IMAGE
  const images = document.querySelectorAll('.gallery img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const closeLightbox = document.getElementById('closeLightbox');

  images.forEach(img => {
    img.addEventListener('click', () => {
      lightbox.classList.add('show');
      lightboxImg.src = img.src;
    });
  });

  closeLightbox.addEventListener('click', () => {
    lightbox.classList.remove('show');
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target !== lightboxImg) {
      lightbox.classList.remove('show');
    }
  });

  // ESC CLOSE
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      lightbox.classList.remove('show');
    }
  });
</script>

</body>
</html>
